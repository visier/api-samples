bundle:
  name: visier_sdlc

include:
  - resources/*.yml

scripts:
  prepare_deploy:
    content: uv run --locked --no-dev --project src/visier-sdlc python src/visier-sdlc/scripts/prepare_deploy.py

sync:
  exclude:
    - deployment.json
    - src/visier-sdlc/tests/**
    - src/visier-sdlc/.env*
    - src/visier-sdlc/instance/**
    - src/visier-sdlc/**/__pycache__/**
    - src/visier-sdlc/**/*.pyc

variables:
  catalog_name:
    description: "Target Unity Catalog"
  schema_name:
    description: "Target Schema"
  warehouse_id:
    description: "SQL Warehouse ID (required: pass --var warehouse_id=<id>)"
  secret_prefix:
    description: "Prefix for tenant secret names in catalog_name.schema_name; secrets are {prefix}{source|target}-{field}, e.g. visier-sdlc-source-host"
    default: "visier-sdlc-"
  app_name:
    description: "Databricks App name"
  source_name:
    description: "Source tenant label in the application"
    default: "Development"
  target_name:
    description: "Target tenant label in the application"
    default: "Production"
  state_table_name:
    description: "Unqualified promotion state table name in catalog_name.schema_name"
    default: "promotion_state"

targets:
  default:
    default: true
