variables:
  secret_source_host:
    description: "source tenant host (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_source_vanity:
    description: "source tenant vanity (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_source_username:
    description: "source tenant username (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_source_password:
    description: "source tenant password (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_host:
    description: "target tenant host (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_vanity:
    description: "target tenant vanity (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_username:
    description: "target tenant username (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_password:
    description: "target tenant password (stored as UC secret; empty leaves the secret untouched)"
    default: ""

# Local step runs with your Databricks auth.
scripts:
  setup_secrets:
    env:
      CATALOG: ${var.catalog_name}
      SCHEMA: ${var.schema_name}
      PREFIX: ${var.secret_prefix}
      APP_NAME: ${var.app_name}
      TABLE: ${var.state_table_name}
      SECRET_SOURCE_HOST: ${var.secret_source_host}
      SECRET_SOURCE_VANITY: ${var.secret_source_vanity}
      SECRET_SOURCE_USERNAME: ${var.secret_source_username}
      SECRET_SOURCE_PASSWORD: ${var.secret_source_password}
      SECRET_TARGET_HOST: ${var.secret_target_host}
      SECRET_TARGET_VANITY: ${var.secret_target_vanity}
      SECRET_TARGET_USERNAME: ${var.secret_target_username}
      SECRET_TARGET_PASSWORD: ${var.secret_target_password}
    content: python3 src/visier-sdlc/scripts/setup_secrets.py
