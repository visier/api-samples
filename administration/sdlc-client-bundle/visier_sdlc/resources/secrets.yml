variables:
  secret_source_host:
    description: "source tenant host (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_source_vanity:
    description: "source tenant vanity (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_source_username:
    description: "source tenant username (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_source_password:
    description: "source tenant password (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_host:
    description: "target tenant host (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_vanity:
    description: "target tenant vanity (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_username:
    description: "target tenant username (stored as UC secret; empty leaves the secret untouched)"
    default: ""
  secret_target_password:
    description: "target tenant password (stored as UC secret; empty leaves the secret untouched)"
    default: ""

# Local step runs with your Databricks auth.
scripts:
  setup_secrets:
    env:
      BUNDLE_VAR_catalog_name: ${var.catalog_name}
      BUNDLE_VAR_schema_name: ${var.schema_name}
      BUNDLE_VAR_secret_prefix: ${var.secret_prefix}
      BUNDLE_VAR_app_name: ${var.app_name}
      BUNDLE_VAR_state_table_name: ${var.state_table_name}
      BUNDLE_VAR_secret_source_host: ${var.secret_source_host}
      BUNDLE_VAR_secret_source_vanity: ${var.secret_source_vanity}
      BUNDLE_VAR_secret_source_username: ${var.secret_source_username}
      BUNDLE_VAR_secret_source_password: ${var.secret_source_password}
      BUNDLE_VAR_secret_target_host: ${var.secret_target_host}
      BUNDLE_VAR_secret_target_vanity: ${var.secret_target_vanity}
      BUNDLE_VAR_secret_target_username: ${var.secret_target_username}
      BUNDLE_VAR_secret_target_password: ${var.secret_target_password}
    content: uv run --locked --no-dev --project src/visier-sdlc python src/visier-sdlc/scripts/setup_secrets.py
