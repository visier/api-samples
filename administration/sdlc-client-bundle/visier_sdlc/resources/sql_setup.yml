scripts:
  setup_table:
    env:
      BUNDLE_VAR_catalog_name: ${var.catalog_name}
      BUNDLE_VAR_schema_name: ${var.schema_name}
      BUNDLE_VAR_state_table_name: ${var.state_table_name}
      BUNDLE_VAR_warehouse_id: ${var.warehouse_id}
    content: python3 src/visier-sdlc/scripts/setup_table.py

resources:
  jobs:
    sql_setup_job:
      name: "[${bundle.target}] SQL Setup"
      
      parameters:
        - name: catalog
          default: ${var.catalog_name}
        - name: schema
          default: ${var.schema_name}
        - name: table
          default: ${var.state_table_name}

      tasks:
        - task_key: run_init_sql
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/init_tables.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              table: "{{job.parameters.table}}"
